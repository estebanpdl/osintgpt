name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.10 is the floor pyproject declares; 3.14 is what development
        # actually runs on, so both ends have to stay green.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # The package is developed on Windows; keep one runner honest about
          # path handling rather than discovering it at release.
          - os: windows-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov=osintgpt --cov-report=term-missing

  offline:
    name: no network reaches a provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # tiktoken fetches its BPE encoding files on first use and caches them.
      # Those are static assets, not a provider call, so warm them before the
      # guard goes up rather than punching a hole in it.
      - name: Warm the tiktoken cache
        run: |
          python -c "import tiktoken; [tiktoken.get_encoding(n) for n in ('cl100k_base', 'o200k_base')]"

      # Unit tests stub their clients, so any real socket from here is a test
      # that would have called a provider for real. ci/sitecustomize.py refuses
      # outbound connections.
      - name: Test with sockets blocked
        run: python -m pytest -p no:cacheprovider
        env:
          PYTHONPATH: ci

  build:
    name: build + metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
