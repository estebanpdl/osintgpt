[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osintgpt"
version = "0.6.0"
description = "A Python OSINT tool using Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Esteban Ponce de Leon" }
]
keywords = ["osint", "llm", "rag", "retrieval", "embeddings", "text-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities"
]
# Common analyst file formats ship by default; local embeddings and extra backends stay optional below.
dependencies = [
    "anthropic>=1.0.0",
    "google-genai>=2.22.0",
    "markitdown[docx,pdf,pptx,xlsx,xls,outlook]>=0.1.7",
    "openai>=2.54.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pypdf>=6.16.1",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rich>=14.3.4",
    "streamlit>=1.62.0",
    "tiktoken>=0.14.0",
    "tomli-w>=1.2.0",
    "tomli; python_version < '3.11'",
    "typer>=0.27.1"
]

[project.scripts]
osintgpt = "osintgpt.cli.main:main"

[project.optional-dependencies]
# For operators who already run Postgres; the default store needs no server.
postgres = [
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4"
]
qdrant = [
    "qdrant-client>=1.19.0"
]
# sentence-transformers pulls in torch (~650MB); kept opt-in, not default.
local = [
    "sentence-transformers>=5.7.0"
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "python-pptx>=1.0.2",
    "tomli; python_version < '3.11'"
]
all = [
    "osintgpt[local,postgres,qdrant]"
]

[project.urls]
Homepage = "https://github.com/estebanpdl/osintgpt"
Repository = "https://github.com/estebanpdl/osintgpt"
Issues = "https://github.com/estebanpdl/osintgpt/issues"

[tool.setuptools]
# Prompt templates are .md.j2, not .py, so packaging has to be told to carry
# them. Without this a wheel installs the loader and none of the prompts, and
# every call raises TemplateNotFound.
include-package-data = true

[tool.setuptools.packages.find]
include = ["osintgpt*"]

[tool.setuptools.package-data]
"osintgpt.prompts" = ["templates/*.md.j2", "templates/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live service; deselected by default"
]
