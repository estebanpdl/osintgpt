[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osintgpt"
version = "0.2.0"
description = "A Python OSINT tool using Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Esteban Ponce de Leon" }
]
keywords = ["osint", "llm", "rag", "retrieval", "embeddings", "text-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities"
]
dependencies = [
    "openai>=1.0,<3",
    "pandas",
    "python-dotenv",
    "qdrant-client>=1.10,<2",
    "openpyxl",
    "scipy",
    "tiktoken",
    "tomli-w",
    "tomli; python_version < '3.11'"
]

[project.optional-dependencies]
all = [
    "osintgpt[anthropic,local]"
]
anthropic = [
    "anthropic>=0.40,<2"
]
local = [
    "sentence-transformers>=3,<6"
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-mock",
    "tomli; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/estebanpdl/osintgpt"
Repository = "https://github.com/estebanpdl/osintgpt"
Issues = "https://github.com/estebanpdl/osintgpt/issues"

[tool.setuptools.packages.find]
include = ["osintgpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live service; deselected by default"
]
